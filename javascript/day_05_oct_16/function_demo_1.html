<script>
    // 1. Function Declaration
    add(2, 3)
    function add(a, b) {
        console.log(`Addition of ${a} & ${b} is ${a + b}`)
    }
    add(10, 20);

    // 2. Function Expression
    console.log(mul)
    var mul = function (a, b) {
        console.log(`Multiplication of ${a} & ${b} is ${a + b}`)
    }
    mul(10, 20)


    // 3. Arrow Function
    var sub = (a, b) => {
        console.log(`Subtraction of ${a} & ${b} is ${a - b}`)
    }
    sub(10, 20)
</script>
