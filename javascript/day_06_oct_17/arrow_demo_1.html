<script>
    let arr = [10, 20, 30, 40, 50];

    // increase each value by 5
    function incrementBy5(ele) {
        return ele + 5;
    }
    let result1 = arr.map(incrementBy5);
    console.log('result1: ', result1)

    let result2 = arr.map((ele) => ele + 5);
    console.log('result2: ', result2)
</script>
