<body>
    <h1>Count:<span>0</span></h1>
    <button onclick="increment()">Increment</button>
    <button onclick="sayHi()">Say HI</button>

    <script>
        function initializeCount() { // outer
            let count = 0; // once
            return function () {  // many times
                count = count + 1;
                document.querySelector('span').innerText = count;
            }
        }
        let increment = initializeCount();


        function sayHi() {
            console.log('Hiiiiii')
            count = count + 1;
            document.querySelector('span').innerText = count;
        }
    </script>
</body>
