<script>
    let str = 'Hello';   // primitive : Immutable
    str[0] = 'I'
    str[1] = 'f'
    str[2] = 'm'
    console.log('str: ', str);

    let arr = [10, 20, 30, 40, 50]; //  non-primitive : mutable
    arr[0] = 15;
    arr[1] = 25;
    arr[2] = 35;
    console.log('arr: ', arr)


    console.log('Hello' == 'Hello');  // true
    console.log([10,20] == [10,20]);  // false
</script>
