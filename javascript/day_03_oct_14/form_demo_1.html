<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <h3 class="text-center">Registration Form</h3>
    <form method="POST" class="border border-3 rounded-3 p-3 col-sm-4 offset-4">
        <p>
            <label for="firstName">FirstName:</label>
            <input id="firstName" type="search" name="firstName" placeholder="Enter FirstName"
            minlength="5" maxlength="10" required>
        </p>
        <p>
            LastName:
            <input type="text" name="lastName" value="Samantra">
        </p>
        <p>
            Password:
            <input type="password" name="password" pattern="[A-Za-z0-9]{8,}">
        </p>
        <p>
            Gender:
            <input id="male" type="radio" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" value="female">
            Female
        </p>
        <p>
            Languages:
            <input type="checkbox" name="languages" value="telugu">
            Telugu
            <input type="checkbox" name="languages" value="english">
            English
            <input type="checkbox" name="languages" value="hindi">
            Hindi
        </p>
        <p>
            Email:
            <input type="email" name="email">
        </p>
        <p>
            Address:
            <textarea name="address"></textarea>
        </p>
        <p>
            State:
            <select name="state">
                <option value="KA">Karnataka</option>
                <option value="TN">Tamilnadu</option>
                <option value="AP">Andhra pradesh</option>
                <option value="TL">Telengana</option>
            </select>
        </p>
        <p>
            pincode:
            <input type="number" name="pincode">
        </p>

        <input type="reset" value="clear">
        <input type="submit" value="Submit Form">
    </form>
</body>

</html>
