<script>
    var a = 10;   // Script/Global Scope
    let b = 20;
    const c = 30;
    console.log(`Global Scope a: ${a}`); // 10
    console.log(`Global Scope b: ${b}`); // 20
    console.log(`Global Scope c: ${c}`); // 30

    function demo() {
        var a = 100;
        let b = 200;      // Function Scoped
        const c = 300;
        console.log(`Function Scope a: ${a}`); // 100
        console.log(`Function Scope b: ${b}`); // 200
        console.log(`Function Scope c: ${c}`); // 300

        if (true) {
            var a = 1000;
            let b = 2000;      // Block Scoped
            const c = 3000;
            console.log(`Block Scope a: ${a}`); // 1000
            console.log(`Block Scope b: ${b}`); // 2000
            console.log(`Block Scope c: ${c}`); // 3000
        }
    }
    demo()
    // let & const won't allow to re-declare in the same scope
    // re-declaration in other scope is still allowed
</script>
