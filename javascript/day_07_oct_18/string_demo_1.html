<script>
    let str1 = 'JavaScript';  // String Literal
    let str2 = 'JavaScript';  // String Literal

    let str3 = new String('JavaScript'); // String Object
    let str4 = new String('JavaScript'); // String Object

    console.log('Type of str1: ', typeof str1); // String
    console.log('Type of str3: ', typeof str3); // Object

    console.log(str1 == str2); // true - compares value
    console.log(str1 == str3); // true - compares value
    console.log(str3 == str4); // false - address compare
</script>
